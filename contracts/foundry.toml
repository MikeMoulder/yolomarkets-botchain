[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc_version = "0.8.26"
optimizer = true
optimizer_runs = 200
via_ir = false
gas_reports = [
    "PredictionMarket",
    "MarketFactory",
    "CloneablePredictionMarket",
    "CloneableMarketFactory",
]
fs_permissions = [{ access = "read-write", path = "./deployments" }]

remappings = [
    "forge-std/=lib/forge-std/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@prb/math/=lib/prb-math/src/",
]

[rpc_endpoints]
botchain_mainnet = "${BOTCHAIN_RPC_URL}"
bohr_testnet = "${BOTCHAIN_RPC_URL}"

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
int_types = "long"
quote_style = "double"

[fuzz]
runs = 256
